version: '3.8'

services:
  # 1. Database Service (Supabase Postgres)
  db:
    image: supabase/postgres:15.1.1.78
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  # 2. Backend Service (NestJS)
  backend:
    build: ./apps/server
    ports:
      - "8000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/postgres
      # 留默认占位符时后端使用带演示数据的内存存储，开箱即用；
      # 接入真实 Supabase 时替换为项目 URL 与 service_role key 即自动切换
      SUPABASE_URL: ${SUPABASE_URL:-http://placeholder-project.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-placeholder-key}
      # 管家确认时限（秒）：超时未确认自动升级社区值班台
      FALL_ACK_SLA_SECONDS: ${FALL_ACK_SLA_SECONDS:-180}
      # 升级巡检间隔（毫秒）
      FALL_SCAN_INTERVAL_MS: ${FALL_SCAN_INTERVAL_MS:-5000}

  # 3. Frontend Service (React + Vite + Nginx)
  frontend:
    build: ./apps/client
    ports:
      - "3000:80"
    depends_on:
      - backend
